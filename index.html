<!DOCTYPE html>

  <link rel="preload" as="image" href="assets/images/hero-market.webp" type="image/webp" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

  <!-- Persistent partner badge on every slide -->
  <div class="global-partner-badge" data-lang="global_partner_badge"></div>

  <!-- Hover zone to reveal hidden header -->
  <div class="header-trigger-zone" aria-hidden="true"></div>

  <!-- Fixed presentation header (auto-hide) -->
  <header class="presentation-header is-visible">
    <a href="#hero" class="presentation-header__logo">
      <img src="assets/logos/hansoft-logo.svg" alt="Hansoft" width="140" height="32">
    </a>
    <span class="presentation-header__label" data-lang="nav_presentation"></span>
    <div class="lang-switch">
      <button class="lang-switch__btn is-active" data-lang-switch="kg" type="button">
        <span class="lang-switch__flag">🇰🇬</span>
        <span data-lang="lang_kg"></span>
      </button>
      <span class="lang-switch__divider">|</span>
      <button class="lang-switch__btn" data-lang-switch="ru" type="button">
        <span class="lang-switch__flag">🇷🇺</span>
        <span data-lang="lang_ru"></span>
      </button>
    </div>

  <div id="fullpage">

    <!-- SECTION 1: HERO -->
    <section class="section section--hero fp-section" data-anchor="hero">
      <!--
      Prompt: Ultra realistic aerial drone view of a luxury modern marketplace
      in Kyrgyzstan, Uzgen region, clean architecture, snow-capped mountains
      in background, golden hour cinematic lighting, 8K, photorealistic
      -->
      <div class="hero__bg parallax-bg">
        <img src="assets/images/hero-market.webp" alt="" class="hero__bg-img" width="1672" height="941" fetchpriority="high" decoding="async">
      </div>
      <div class="hero__overlay"></div>
      <div class="section__inner hero__content">
        <div class="hero__partner reveal reveal-up">
          <img src="assets/logos/aig-logo.png" alt="AIG" class="hero__partner-logo" width="36" height="36">
          <span data-lang="hero_partner"></span>
        </div>
        <h1 class="hero__title reveal reveal-blur" data-lang="hero_title"></h1>
        <p class="hero__subtitle reveal reveal-up" data-lang="hero_subtitle"></p>
      </div>
      <div class="scroll-indicator scroll-indicator--light">
        <span class="scroll-indicator__text" data-lang="scroll_hint"></span>
        <div class="scroll-indicator__chevron"></div>
      </div>
    </section>
