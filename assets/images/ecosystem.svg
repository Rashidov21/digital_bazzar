<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none">
  <rect width="480" height="480" rx="24" fill="#F5F5F7"/>
  <!-- Hub center - market building -->
  <circle cx="240" cy="240" r="52" fill="#0B2D5B"/>
  <rect x="218" y="218" width="44" height="36" rx="3" fill="#fff" opacity="0.9"/>
  <polygon points="210,218 240,198 270,218" fill="#D4AF37"/>
  <!-- Connection lines -->
  <g stroke="#D4AF37" stroke-width="2.5">
    <line x1="240" y1="188" x2="240" y2="90"/>
    <line x1="276" y1="210" x2="370" y2="140"/>
    <line x1="276" y1="270" x2="370" y2="340"/>
    <line x1="204" y1="270" x2="110" y2="340"/>
    <line x1="204" y1="210" x2="110" y2="140"/>
  </g>
  <!-- Node: Shops -->
  <circle cx="240" cy="70" r="38" fill="#fff" stroke="#0B2D5B" stroke-width="2.5"/>
  <rect x="222" y="58" width="16" height="12" rx="1" fill="#2563EB" opacity="0.5"/>
  <rect x="242" y="58" width="16" height="12" rx="1" fill="#D4AF37" opacity="0.7"/>
  <rect x="228" y="74" width="24" height="4" rx="1" fill="#0B2D5B" opacity="0.3"/>
  <!-- Node: Parking -->
  <circle cx="390" cy="130" r="38" fill="#fff" stroke="#0B2D5B" stroke-width="2.5"/>
  <text x="390" y="138" text-anchor="middle" fill="#D4AF37" font-size="24" font-weight="800" font-family="Inter,sans-serif">P</text>
  <!-- Node: Security -->
  <circle cx="390" cy="350" r="38" fill="#fff" stroke="#0B2D5B" stroke-width="2.5"/>
  <circle cx="390" cy="348" r="10" stroke="#0B2D5B" stroke-width="2" fill="none"/>
  <circle cx="390" cy="348" r="4" fill="#0B2D5B"/>
  <rect x="378" y="330" width="24" height="10" rx="2" fill="#0B2D5B" opacity="0.3"/>
  <!-- Node: Payments -->
  <circle cx="90" cy="350" r="38" fill="#fff" stroke="#0B2D5B" stroke-width="2.5"/>
  <rect x="72" y="340" width="36" height="24" rx="3" stroke="#2563EB" stroke-width="2" fill="none"/>
  <rect x="78" y="348" width="24" height="4" rx="1" fill="#D4AF37"/>
  <!-- Node: Management -->
  <circle cx="90" cy="130" r="38" fill="#fff" stroke="#0B2D5B" stroke-width="2.5"/>
  <rect x="72" y="118" width="36" height="28" rx="2" stroke="#0B2D5B" stroke-width="2" fill="none"/>
  <path d="M78 128h24M78 134h18M78 140h12" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
</svg>
