<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none">
  <defs>
    <linearGradient id="evening" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0B2D5B"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" rx="20" fill="url(#evening)"/>
  <!-- Building -->
  <rect x="80" y="200" width="640" height="280" rx="6" fill="#F5F5F7" opacity="0.95"/>
  <rect x="80" y="200" width="640" height="40" fill="#0B2D5B" opacity="0.15"/>
  <!-- Main LED screen -->
  <rect x="120" y="100" width="280" height="160" rx="8" fill="#111" stroke="#D4AF37" stroke-width="4"/>
  <rect x="130" y="110" width="260" height="140" rx="4" fill="url(#screen)" opacity="0.85"/>
  <!-- Secondary screen -->
  <rect x="440" y="130" width="240" height="120" rx="8" fill="#111" stroke="#D4AF37" stroke-width="3"/>
  <rect x="450" y="140" width="220" height="100" rx="4" fill="url(#screen)" opacity="0.7"/>
  <!-- Market entrance -->
  <rect x="320" y="280" width="160" height="120" rx="4" fill="#E8EEF5" stroke="#2563EB" stroke-width="2"/>
  <path d="M360 280 L400 240 L440 280" fill="#0B2D5B" opacity="0.2"/>
  <!-- People silhouettes -->
  <ellipse cx="280" cy="420" rx="12" ry="6" fill="#333" opacity="0.3"/>
  <rect x="274" y="390" width="12" height="30" rx="4" fill="#333" opacity="0.3"/>
  <ellipse cx="520" cy="420" rx="12" ry="6" fill="#333" opacity="0.3"/>
  <rect x="514" y="390" width="12" height="30" rx="4" fill="#333" opacity="0.3"/>
  <!-- Glow -->
  <ellipse cx="260" cy="180" rx="160" ry="60" fill="#D4AF37" opacity="0.12"/>
  <ellipse cx="560" cy="190" rx="120" ry="50" fill="#2563EB" opacity="0.1"/>
</svg>
