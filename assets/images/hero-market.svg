<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="55%" stop-color="#E8C896"/>
      <stop offset="100%" stop-color="#C4956A"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B8FA8"/>
      <stop offset="100%" stop-color="#2C4A62"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
  <polygon points="0,380 180,220 420,300 680,180 920,260 1200,200 1200,675 0,675" fill="url(#mtn)" opacity="0.85"/>
  <polygon points="0,450 250,340 520,400 800,320 1200,380 1200,675 0,675" fill="#1E3344" opacity="0.55"/>
  <!-- Main market complex -->
  <g transform="translate(280,320)">
    <rect x="0" y="80" width="640" height="120" rx="6" fill="#F5F5F7" stroke="#0B2D5B" stroke-width="3"/>
    <polygon points="-10,80 320,20 650,80" fill="#0B2D5B" opacity="0.9"/>
    <!-- Shop fronts -->
    <g fill="#E8EEF5" stroke="#2563EB" stroke-width="2">
      <rect x="20" y="100" width="70" height="55" rx="3"/>
      <rect x="105" y="100" width="70" height="55" rx="3"/>
      <rect x="190" y="100" width="70" height="55" rx="3"/>
      <rect x="275" y="100" width="70" height="55" rx="3"/>
      <rect x="360" y="100" width="70" height="55" rx="3"/>
      <rect x="445" y="100" width="70" height="55" rx="3"/>
      <rect x="530" y="100" width="70" height="55" rx="3"/>
    </g>
    <!-- Awning accents -->
    <rect x="20" y="95" width="70" height="6" fill="#D4AF37" opacity="0.8"/>
    <rect x="190" y="95" width="70" height="6" fill="#D4AF37" opacity="0.8"/>
    <rect x="360" y="95" width="70" height="6" fill="#D4AF37" opacity="0.8"/>
    <rect x="530" y="95" width="70" height="6" fill="#D4AF37" opacity="0.8"/>
  </g>
  <!-- Parking area -->
  <rect x="320" y="480" width="560" height="100" rx="4" fill="#3A4550" opacity="0.35"/>
  <g stroke="#fff" stroke-width="2" opacity="0.5">
    <line x1="400" y1="490" x2="400" y2="570"/><line x1="500" y1="490" x2="500" y2="570"/>
    <line x1="600" y1="490" x2="600" y2="570"/><line x1="700" y1="490" x2="700" y2="570"/>
    <line x1="800" y1="490" x2="800" y2="570"/>
  </g>
  <!-- Cars top-down -->
  <rect x="410" y="505" width="36" height="56" rx="6" fill="#0B2D5B" opacity="0.7" transform="rotate(90 428 533)"/>
  <rect x="510" y="520" width="36" height="56" rx="6" fill="#2563EB" opacity="0.6" transform="rotate(90 528 548)"/>
  <rect x="620" y="505" width="36" height="56" rx="6" fill="#0B2D5B" opacity="0.7" transform="rotate(90 638 533)"/>
  <!-- Road -->
  <path d="M600 580 Q600 620 600 660" stroke="#555" stroke-width="24" stroke-linecap="round" opacity="0.4"/>
  <!-- Trees -->
  <circle cx="240" cy="520" r="28" fill="#3D6B4F" opacity="0.6"/>
  <circle cx="960" cy="520" r="28" fill="#3D6B4F" opacity="0.6"/>
</svg>
