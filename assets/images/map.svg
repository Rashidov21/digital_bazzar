<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none">
  <rect width="480" height="480" rx="24" fill="#F5F5F7"/>
  <!-- Floor plan blocks -->
  <g fill="#E8E8ED" stroke="#CBD5E1" stroke-width="1.5">
    <rect x="40" y="40" width="90" height="70" rx="6"/>
    <rect x="150" y="40" width="90" height="70" rx="6"/>
    <rect x="260" y="40" width="90" height="70" rx="6"/>
    <rect x="370" y="40" width="70" height="70" rx="6"/>
    <rect x="40" y="130" width="130" height="90" rx="6"/>
    <rect x="40" y="240" width="90" height="70" rx="6"/>
    <rect x="150" y="240" width="90" height="70" rx="6"/>
    <rect x="260" y="240" width="90" height="70" rx="6"/>
    <rect x="370" y="240" width="70" height="70" rx="6"/>
    <rect x="40" y="330" width="90" height="70" rx="6"/>
    <rect x="150" y="330" width="200" height="70" rx="6"/>
    <rect x="370" y="330" width="70" height="70" rx="6"/>
  </g>
  <!-- Highlighted shop -->
  <rect x="190" y="130" width="150" height="90" rx="6" fill="#0B2D5B" opacity="0.12" stroke="#0B2D5B" stroke-width="2.5"/>
  <!-- Walking path -->
  <path d="M240 420 L240 360 L240 300 L190 265 L190 220" stroke="#2563EB" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- You are here -->
  <circle cx="240" cy="420" r="14" fill="#2563EB" opacity="0.2"/>
  <circle cx="240" cy="420" r="6" fill="#2563EB"/>
  <!-- Destination pin -->
  <path d="M240 265 L268 225 L240 185 L212 225 Z" fill="#D4AF37" stroke="#0B2D5B" stroke-width="2"/>
  <circle cx="240" cy="225" r="8" fill="#0B2D5B"/>
  <!-- Entrance -->
  <rect x="210" y="400" width="60" height="16" rx="3" fill="#3D6B4F" opacity="0.5"/>
  <text x="240" y="455" text-anchor="middle" fill="#0B2D5B" font-size="11" font-weight="600" font-family="Inter,sans-serif" opacity="0.5">²</text>
</svg>
