<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none">
  <rect width="800" height="560" rx="20" fill="#EEF1F5"/>
  <!-- Asphalt -->
  <rect x="40" y="60" width="720" height="440" rx="8" fill="#4A5568" opacity="0.85"/>
  <!-- Parking lines -->
  <g stroke="#fff" stroke-width="2.5" opacity="0.7">
    <line x1="180" y1="80" x2="180" y2="480"/>
    <line x1="320" y1="80" x2="320" y2="480"/>
    <line x1="460" y1="80" x2="460" y2="480"/>
    <line x1="600" y1="80" x2="600" y2="480"/>
    <line x1="80" y1="180" x2="720" y2="180"/>
    <line x1="80" y1="300" x2="720" y2="300"/>
    <line x1="80" y1="420" x2="720" y2="420"/>
  </g>
  <!-- P signs -->
  <g fill="#D4AF37">
    <circle cx="130" cy="130" r="22" fill="#fff" stroke="#D4AF37" stroke-width="3"/>
    <text x="130" y="138" text-anchor="middle" fill="#0B2D5B" font-size="22" font-weight="800" font-family="Inter,sans-serif">P</text>
    <circle cx="670" cy="130" r="22" fill="#fff" stroke="#D4AF37" stroke-width="3"/>
    <text x="670" y="138" text-anchor="middle" fill="#0B2D5B" font-size="22" font-weight="800" font-family="Inter,sans-serif">P</text>
  </g>
  <!-- Entry gate -->
  <rect x="350" y="20" width="100" height="12" rx="2" fill="#0B2D5B"/>
  <rect x="395" y="32" width="10" height="50" fill="#888"/>
  <rect x="350" y="50" width="100" height="8" rx="2" fill="#D4AF37" transform="rotate(-8 400 54)"/>
  <!-- Cars (top view) -->
  <g>
    <rect x="210" y="100" width="44" height="68" rx="8" fill="#0B2D5B" opacity="0.85"/>
    <rect x="220" y="108" width="24" height="20" rx="3" fill="#2563EB" opacity="0.5"/>
    <rect x="350" y="100" width="44" height="68" rx="8" fill="#2563EB" opacity="0.75"/>
    <rect x="490" y="220" width="44" height="68" rx="8" fill="#0B2D5B" opacity="0.85"/>
    <rect x="630" y="340" width="44" height="68" rx="8" fill="#D4AF37" opacity="0.8"/>
    <rect x="100" y="340" width="44" height="68" rx="8" fill="#2563EB" opacity="0.75"/>
    <!-- Empty spot indicator -->
    <rect x="490" y="100" width="44" height="68" rx="8" stroke="#4ADE80" stroke-width="3" stroke-dasharray="8 4" fill="none"/>
  </g>
  <!-- Direction arrows -->
  <path d="M400 500 L400 460 M385 475 L400 460 L415 475" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M60 300 L100 300 M85 285 L100 300 L85 315" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- Landscaping -->
  <ellipse cx="60" cy="500" rx="40" ry="20" fill="#3D6B4F" opacity="0.5"/>
  <ellipse cx="740" cy="500" rx="40" ry="20" fill="#3D6B4F" opacity="0.5"/>
</svg>
