<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0B2D5B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" rx="20" fill="url(#night)"/>
  <!-- Smart market building -->
  <rect x="200" y="280" width="400" height="180" rx="8" fill="#F5F5F7" opacity="0.95"/>
  <polygon points="180,280 400,160 620,280" fill="#E8EEF5" stroke="#2563EB" stroke-width="2"/>
  <!-- Connected nodes -->
  <circle cx="400" cy="240" r="36" fill="#0B2D5B" opacity="0.9"/>
  <circle cx="400" cy="240" r="50" stroke="#D4AF37" stroke-width="2" opacity="0.5" fill="none"/>
  <circle cx="400" cy="240" r="65" stroke="#2563EB" stroke-width="1" opacity="0.3" fill="none"/>
  <!-- Satellite tech points -->
  <g stroke="#D4AF37" stroke-width="2" opacity="0.7">
    <line x1="400" y1="204" x2="400" y2="120"/>
    <line x1="436" y1="240" x2="520" y2="200"/>
    <line x1="364" y1="240" x2="280" y2="200"/>
    <line x1="430" y1="270" x2="500" y2="320"/>
    <line x1="370" y1="270" x2="300" y2="320"/>
  </g>
  <circle cx="400" cy="110" r="14" fill="#2563EB" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="530" cy="195" r="14" fill="#2563EB" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="270" cy="195" r="14" fill="#2563EB" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="510" cy="325" r="14" fill="#2563EB" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="290" cy="325" r="14" fill="#2563EB" stroke="#D4AF37" stroke-width="2"/>
  <!-- Shop windows lit -->
  <g fill="#2563EB" opacity="0.3">
    <rect x="230" y="320" width="50" height="40" rx="2"/>
    <rect x="300" y="320" width="50" height="40" rx="2"/>
    <rect x="450" y="320" width="50" height="40" rx="2"/>
    <rect x="520" y="320" width="50" height="40" rx="2"/>
  </g>
  <!-- Stars -->
  <circle cx="120" cy="80" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="680" cy="60" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="600" cy="100" r="2" fill="#D4AF37" opacity="0.7"/>
</svg>
